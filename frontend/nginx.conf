server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving the backend per request (see below) lets
  # nginx start, and recover, even when the API container is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

  # API: /api/notes -> http://app:3000/notes (the /api prefix is stripped).
  location /api/ {
    set $backend http://app:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints these file names, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location = /favicon.ico {
    access_log off;
    return 204;
  }

  # Single-page app: unknown paths get index.html (never cached, so a new
  # deploy is picked up straight away).
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
