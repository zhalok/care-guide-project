# The API upstream. `keepalive` lets nginx reuse connections to the app instead
# of opening a new TCP connection per request: without it, thousands of requests
# per minute leave sockets in TIME_WAIT until nginx runs out of local ports and
# answers 502 ("connect() failed (99: Address not available)").
#
# `resolve` (nginx >= 1.27.3) re-resolves "app" through Docker's DNS, so nginx
# still starts, and recovers, when the API container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
  zone api_backend 64k;
  server app:3000 resolve;
  keepalive 256;
  # Shorter than Node's default 5 s idle timeout, so nginx never reuses a
  # connection that the app has just closed.
  keepalive_timeout 4s;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

  # API: /api/notes -> http://app:3000/notes (the /api prefix is stripped).
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api_backend;

    # HTTP/1.1 with an empty Connection header is required for upstream keepalive.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints these file names, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location = /favicon.ico {
    access_log off;
    return 204;
  }

  # Single-page app: unknown paths get index.html (never cached, so a new
  # deploy is picked up straight away).
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
