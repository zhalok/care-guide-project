services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Bound to localhost only, so `npm run start:dev` on your machine can reach it.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Trace backend + UI. Traces are kept in memory, so they are lost on restart.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    restart: unless-stopped
    ports:
      # UI: http://localhost:16686
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      # OTLP/HTTP, so `npm run start:dev` on your machine can export too.
      - "127.0.0.1:${OTLP_PORT:-4318}:4318"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/care-guide
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      OTEL_SERVICE_NAME: care-guide-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

volumes:
  mongo-data:
