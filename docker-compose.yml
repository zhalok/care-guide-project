services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Bound to localhost only, so `npm run start:dev` on your machine can reach it.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Trace store (Grafana reads it through the Tempo datasource). Receives OTLP
  # from the app; traces are searchable in Grafana: Explore > Tempo.
  tempo:
    image: grafana/tempo:3.0.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      # OTLP/HTTP, so `npm run start:dev` on your machine can export too.
      - "127.0.0.1:${OTLP_PORT:-4318}:4318"

  # Scrapes the app's /metrics (OpenTelemetry) every 5s. UI: http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  # Dashboards: http://localhost:3001 (the "API latency" dashboard is provisioned;
  # traces: Explore > Tempo, or the trace tables on that dashboard).
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Local dev convenience: anyone reaching localhost:3001 can view dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-latency.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      tempo:
        condition: service_started
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/care-guide}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # Used by the seed script (docker compose run --rm app node dist/seed/seed.js).
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      # nginx (the web service) is one proxy hop in front of the app.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-care-guide-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      # /metrics must be reachable from the prometheus container. The port is not
      # published to the host, so only the compose network can see it.
      OTEL_EXPORTER_PROMETHEUS_HOST: ${OTEL_EXPORTER_PROMETHEUS_HOST:-0.0.0.0}

  # React frontend: nginx serves the built files and forwards /api/* to the app.
  # Open http://localhost:8080
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
  tempo-data:
